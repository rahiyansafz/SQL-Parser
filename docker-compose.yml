  #     POSTGRES_PASSWORD: postgrespassword
  #     POSTGRES_DB: sampledb
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - db-analyzer-network
  
  # mongodb:
  #   image: mongo:6

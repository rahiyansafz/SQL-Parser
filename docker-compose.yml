version: '3.8'

services:
  app:
    build: .
    container_name: ai-db-analyzer
    volumes:
      - ./sql_files:/app/sql_files
      - ./schema_results:/app/schema_results
    environment:
      - NODE_ENV=production
    networks:
      - db-analyzer-network

  # Example database services for live schema extraction
  # Uncomment as needed
  
  # mysql:
